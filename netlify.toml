[build]
  publish = "."

# _build holds the page generator and article data; don't serve it.
[[redirects]]
  from = "/_build/*"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
